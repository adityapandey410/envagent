[project]
name = "envagent"
version = "0.1.0"
description = "Natural-language CLI agent for developer environment setup"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.5.0",
    "beautifulsoup4>=4.15.0",
    "google-genai>=2.23.0",
    "httpx>=0.28.1",
    "json-repair>=0.63.4",
    "json5>=0.15.0",
    "keyring>=25.7.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langsmith>=0.12.4",
    "openai>=3.13.0",
    "platformdirs>=4.11.8",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "tomli-w>=1.2.0",
    "typer>=0.27.2",
]

[project.scripts]
envagent = "envagent.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
